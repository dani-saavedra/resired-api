spring:
    application:
        name: resired
    servlet:
        multipart:
            max-file-size: 5MB
            max-request-size: 5MB
    datasource:
        password: ${DB_PASS}
        username: ${DB_USER}
        url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    flyway:
        enabled: 'true'
    jpa:
        hibernate:
            ddl-auto: validate
        database-platform: org.hibernate.dialect.MySQL8Dialect
info:
    app:
        name: Resired
        version: '0.1'
smtp:
    host: smtp.hostinger.com
    port: '587'
    pass: ${EMAIL_PASS}
    user: ${EMAIL_USER}
secret: ${SECRET_KEY}
springdoc:
    api-docs:
        path: /docs
cors:
    allowedMethods: '*'
    allowedOrigins: '*'
    pathPattern: /**
    allowedHeaders: '*'
topic:
    block: /topics/blocks-
    neighborhood: /topics/neighborhoods-
server:
    servlet:
        context-path: /api
